<div class="page">

  <div class="top-bar">
    <div class="logo">My Angular App</div>

    <div class="menu-toggle" (click)="toggleMenu()">
      ☰
    </div>
  </div>

  @if (isMenuOpen) {
    <div class="menu">
        <div class="menu-item">Home</div>
        <div class="menu-item">Articles</div>
        <div class="menu-item">Contact</div>
    </div>
  }


  <div class="content">

    <div class="title">Welcome</div>

    <div class="card">
      <div class="card-title">Profile</div>

      <img [src]="imageUrl">

      <div class="text">
        This is a short description of the profile section.
      </div>

      <div class="actions">
        <div class="save-btn" (click)="save()">Save</div>
      </div>
    </div>

    <div class="form">
      <div>Username</div>
      <input type="text">

      <div>Password</div>
      <input type="password">
    </div>

    @if (showNotification) {
        <div class="notification">
        Saved successfully
        </div>
    }

  </div>

</div>
