<h2>Application Settings</h2>

<p class="status">{{ statusMessage() }}</p>

<button
  #openButton
  class="open-panel"
  tabindex="0"
  (click)="openPanel()"
>
  Open Settings Panel
</button>

<a href="#">Background Link</a>

@if(isPanelOpen()) {
<div class="panel">
  <h3>Settings Panel</h3>

  <label>
    Username
    <input #usernameInput type="text" />
  </label>

  <button class="toggle" tabindex="0" (click)="toggleAdvanced()">
    Toggle Advanced Settings
  </button>

    @if(showAdvanced()) {
  <button>
    <label>
      API Key
      <input class="advancedInput" #advancedInput type="text" />
    </label>
  </button>
}

  <div class="actions">
    <button class="action" tabindex="0" (click)="save()">Save</button>
    <button class="action" tabindex="0" (click)="closePanel()">Cancel</button>
  </div>
</div>
}
